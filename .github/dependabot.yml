# Weekly update PRs. Each one runs .github/workflows/ci.yml (tests + audits), so a bad update shows up red.
# cooldown: ignore releases younger than 7 days (version updates only), so a freshly compromised
# release is unlikely to reach a PR. Minor+patch updates are grouped into one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: uv # pyproject.toml + uv.lock
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm # web/package.json + web/package-lock.json
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm # gateway/package.json + gateway/package-lock.json
    directory: /gateway
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker # gateway/Dockerfile: the digest-pinned node base image
    directory: /gateway
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose # docker-compose.yml: the digest-pinned guacd image
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions # keeps the SHA-pinned actions in the workflows current
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
