name: ci

on:
  push:
    branches: [main]
  pull_request: # includes Dependabot's update PRs: a bad update shows up red
  schedule:
    - cron: "0 6 * * 1" # weekly: new advisories land without any commit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to a commit SHA (a tag can be moved); Dependabot keeps them current.
# ponytail: the two scanners below are pinned inline, so Dependabot can't bump them: update by hand.
env:
  PIP_AUDIT_VERSION: "2.10.1"
  SEMGREP_VERSION: "1.183.0"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            gateway/package-lock.json
      - run: uv sync --locked --extra web # --locked: fail if uv.lock is out of date with pyproject.toml
      - run: uv run python tests/test_args.py
      - run: npm ci --ignore-scripts # no dependency install scripts
        working-directory: web
      - run: npm ci --ignore-scripts
        working-directory: gateway
      - run: npm test # token round trip: Python -> real gateway -> fake guacd
        working-directory: web
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
      - run: npm run test:browser # <agvisor-desktop> in real Chrome (preinstalled on the runner) via the real gateway
        working-directory: web
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python

  audit: # known-vulnerable dependencies, checked against the locked versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pip-audit (runtime deps + the web and mcp extras, exactly as locked)
        run: |
          uv export --locked --no-dev --extra web --extra mcp --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx "pip-audit==$PIP_AUDIT_VERSION" -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps --strict
      - name: npm audit (the browser component and the gateway, dev dependencies included)
        run: |
          for dir in web gateway; do
            (cd "$dir" && npm ci --ignore-scripts && npm audit && npm audit signatures)
          done

  semgrep: # vulnerable code patterns in the Python, JS and the workflows themselves
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # not CodeQL: on a private repo it needs GitHub Advanced Security. Swap it in if the repo goes public.
      - run: >
          uvx --from "semgrep==$SEMGREP_VERSION" semgrep scan --metrics off --error
          --config p/python --config p/javascript --config p/github-actions --config p/dockerfile
          src web/agvisor-desktop.js gateway/gateway.js gateway/Dockerfile web/e2e.mjs .github

  gvisor: # the tests/test_gvisor_*.py scripts, on the runner's own docker with real runsc
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ponytail: pinned by hand (Dependabot can't see it): bump the release and its hash from the .sha512 next to the tarball.
    env:
      GVISOR_RELEASE: "20261026.0"
      GVISOR_SHA512: e6aa030fb8379fe92b53e9b8b696419e0dce8a3bbcc7d4c1cf76b2ea3d6569eabd7360e694deda6ccbdcd77095b3e82ca0f90a3d8fd13a3e5d6b11cd29fe4649
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Limits(workspace=) is an xfs project quota on docker's volumes directory: give the runner one (a loop-mounted xfs with
      # pquota under /var/lib/docker/volumes, set up while docker is stopped; the next step starts docker again).
      - name: xfs with project quotas under /var/lib/docker/volumes
        run: |
          sudo apt-get install -y -qq xfsprogs > /dev/null
          sudo systemctl stop docker docker.socket
          sudo truncate -s 4G /xfs.img
          sudo mkfs.xfs -q /xfs.img
          sudo mkdir -p /var/lib/docker/volumes
          sudo mount -o loop,pquota /xfs.img /var/lib/docker/volumes
      - name: install gVisor and register it as the docker runtime "runsc"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gvisor.tar.zstd" "https://storage.googleapis.com/gvisor/releases/release/$GVISOR_RELEASE/x86_64/gvisor.tar.zstd"
          echo "$GVISOR_SHA512  $RUNNER_TEMP/gvisor.tar.zstd" | sha512sum -c -
          mkdir "$RUNNER_TEMP/gvisor"
          tar --zstd -xf "$RUNNER_TEMP/gvisor.tar.zstd" -C "$RUNNER_TEMP/gvisor"
          sudo cp -r "$RUNNER_TEMP"/gvisor/* /usr/local/bin/
          sudo runsc install
          sudo systemctl restart docker
          docker info --format '{{json .Runtimes}}' | grep -q runsc
      # The EC2 metadata service, faked: a sandbox on bridge reaches the real one THROUGH the host (it lives off the instance),
      # so the fake sits behind a veth in a network namespace and the host forwards to it, DOCKER-USER chain included.
      # It shadows the runner's own 169.254.169.254 (Azure's) route for the rest of the job.
      - name: a fake EC2 metadata service at 169.254.169.254
        run: |
          sudo ip netns add imds
          sudo ip link add imds0 type veth peer name imds1 netns imds
          sudo ip addr add 10.99.0.1/24 dev imds0
          sudo ip link set imds0 up
          sudo ip netns exec imds sh -c 'ip addr add 10.99.0.2/24 dev imds1 && ip link set imds1 up && ip link set lo up && ip addr add 169.254.169.254/32 dev lo && ip route add default via 10.99.0.1'
          sudo ip route replace 169.254.169.254/32 via 10.99.0.2
          sudo ip netns exec imds setsid nohup python3 tests/fake_imds.py > "$RUNNER_TEMP/imds.log" 2>&1 &
          # the server takes a moment to come up (a fixed sleep lost that race once): retry while the port refuses
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://169.254.169.254/latest/meta-data/instance-id || { cat "$RUNNER_TEMP/imds.log"; exit 1; }
      - name: the real-runsc test scripts (every script runs, so one failure doesn't hide the others)
        env:
          AGVISOR_IMAGE: python:3.12-slim
          AGVISOR_RUNTIME: runsc
        run: |
          rc=0
          for t in files gvisor_disk gvisor_entrypoint gvisor_snapshot gvisor_jobs gvisor_egress gvisor_mcp mcp_stdio gvisor_imds gvisor_workspace; do
            echo "::group::test_$t"
            uv run --locked --extra mcp python "tests/test_$t.py" || { echo "::error::test_$t failed"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc
