name: publish-npm

# Releases the <agvisor-desktop> web component (web/) to npm with Trusted Publishing: npm trusts this workflow through
# OIDC, so no npm token is stored anywhere, and the package gets a provenance attestation.
#   - push a tag web-vX.Y.Z   -> npm
#   - run this workflow by hand -> a dry run: builds and tests the package and lists the tarball, publishes nothing
# The tag has its own prefix because the Python package releases on plain vX.Y.Z (publish.yml): a GitHub release for the
# web component would also fire that workflow, and would become the repo's "Latest" release.
#
# One-time setup:
#   1. Publish the FIRST version by hand (`cd web && npm publish`): npm only lets you add a trusted publisher to a
#      package that already exists. Do NOT push a tag for that version, the workflow would fail (a version can't be
#      published twice).
#   2. npmjs.com > agvisor-desktop > Settings > Trusted Publisher > GitHub Actions:
#      owner cr-sbarbouche | repository agvisor | workflow publish-npm.yml | environment npm
#   3. Create the GitHub environment `npm` (Settings > Environments). Optional but wise: require your approval, so a
#      stray tag can't publish by accident.
# To release: `cd web && npm version X.Y.Z --no-git-tag-version` (updates package.json and the lockfile), merge to main,
# then `git tag web-vX.Y.Z <commit on main> && git push origin web-vX.Y.Z`.
on:
  push:
    tags: ["web-v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the guard below needs origin/main
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            gateway/package-lock.json
      - name: Tag must match the package version and be on main
        if: github.event_name == 'push'
        run: |
          test "web-v$(node -p "require('./web/package.json').version")" = "$GITHUB_REF_NAME"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main  # a tag on an unreviewed branch must not publish
      # same checks as ci.yml: what gets published passed them
      - run: uv sync --locked --extra web
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci --ignore-scripts
        working-directory: gateway
      - run: npm test
        working-directory: web
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
      - run: npm run test:browser
        working-directory: web
        env:
          PYTHON: ${{ github.workspace }}/.venv/bin/python
      - name: Pack, and list what would be published
        run: |
          mkdir dist
          npm pack --pack-destination ../dist
          tar tzf dist/*.tgz
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-dist
          path: dist/
          if-no-files-found: error

  # This job runs no project code: it only publishes the tarball `build` produced, and only it gets id-token.
  publish-npm:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Trusted Publishing needs npm 11.5.1 or newer
        run: |
          v=$(npm --version)
          [ "$(printf '%s\n11.5.1\n' "$v" | sort -V | head -n1)" = "11.5.1" ] || { echo "npm $v is too old" >&2; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-dist
          path: dist/
      - run: npm publish dist/*.tgz --provenance
