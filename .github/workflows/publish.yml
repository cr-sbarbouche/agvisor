name: publish

# Releases to PyPI with Trusted Publishing: PyPI trusts this workflow through OIDC, so no API token is stored anywhere.
#   - publish a GitHub release (tag vX.Y.Z)  -> PyPI
#   - run this workflow by hand              -> TestPyPI (a dry run: nothing reaches PyPI)
#
# One-time setup, on BOTH pypi.org and test.pypi.org (Account settings > Publishing > add a pending publisher):
#   project agvisor | owner cr-sbarbouche | repository agvisor | workflow publish.yml | environment pypi (testpypi on TestPyPI)
# and create the GitHub environments `pypi` and `testpypi` (Settings > Environments). Optional but wise: make `pypi`
# require your approval, so a release can't publish by accident.
# To release: bump `version` in pyproject.toml, merge to main, then create a GitHub release tagged v<that version>.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Release tag must match the package version
        if: github.event_name == 'release'
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - run: uv run python tests/test_args.py
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # The publish jobs run no project code: they only upload what `build` produced, and only they get id-token.
  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
