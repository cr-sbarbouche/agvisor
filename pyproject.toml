[project]
name = "agvisor"
version = "0.1.4"
description = "gVisor sandboxes for coding agents, with resource limits and optional GUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sadok Barbouche" }]
requires-python = ">=3.12"
keywords = ["gvisor", "runsc", "sandbox", "docker", "ai-agents", "code-execution"]
classifiers = [
    "Development Status :: 3 - Alpha",  # PyPI badge; the README says what "alpha" means here (Security section)
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cr-sbarbouche/agvisor"
Issues = "https://github.com/cr-sbarbouche/agvisor/issues"
Security = "https://github.com/cr-sbarbouche/agvisor/blob/main/SECURITY.md"
Changelog = "https://github.com/cr-sbarbouche/agvisor/releases"

[project.optional-dependencies]
web = ["cryptography>=42"]  # only for Sandbox.desktop_token()
mcp = ["mcp>=2"]  # only for the agvisor-mcp server; 2.x renamed FastMCP to MCPServer, so 1.x won't do

[project.scripts]
agvisor = "agvisor.cli:main"
agvisor-mcp = "agvisor.mcp_server:main"

[build-system]
requires = ["hatchling>=1.27"]  # SPDX `license = "MIT"` (PEP 639) needs 1.27+
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/SECURITY.md"]  # the Python package only: not gateway/, web/, CI files
