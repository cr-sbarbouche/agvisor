[project]
name = "agvisor"
version = "0.1.0"
description = "gVisor sandboxes for coding agents, with resource limits and optional GUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sadok Barbouche" }]
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
web = ["cryptography>=42"]  # only for Sandbox.desktop_token()

[build-system]
requires = ["hatchling>=1.27"]  # SPDX `license = "MIT"` (PEP 639) needs 1.27+
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/notes"]  # internal working notes: keep them out of the published source archive
