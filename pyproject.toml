[project]
name = "agvisor"
version = "0.1.0"
description = "gVisor sandboxes for coding agents, with resource limits and optional GUI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sadok Barbouche" }]
requires-python = ">=3.12"
classifiers = ["Development Status :: 3 - Alpha"]  # PyPI badge; the README says what "alpha" means here (Security section)
dependencies = []

[project.optional-dependencies]
web = ["cryptography>=42"]  # only for Sandbox.desktop_token()

[build-system]
requires = ["hatchling>=1.27"]  # SPDX `license = "MIT"` (PEP 639) needs 1.27+
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/LICENSE", "/SECURITY.md"]  # the Python package only: not gateway/, web/, CI files
